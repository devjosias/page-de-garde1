<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Page de Garde</title>

    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #004B70;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .top-bar {
            background: rgba(255,255,255,0.1);
            padding: 10px;
        }

        .logo-small {
            width: 60px;
        }

        /* Carrousel */
        .carousel-inner img {
            border-radius: 10px;
            height: 260px;
            object-fit: cover;
            width: 100%;
        }

        /* Cadre principal */
        .main-container {
            margin-top: 40px;
            background: linear-gradient(to right, rgba(255,255,255,0.08), rgba(255,255,255,0.15));
            padding: 30px;
            border-radius: 15px;
        }

        /* Formulaire */
        .form-box {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            padding: 30px;
            border-radius: 12px;
        }

        .title-app {
            font-size: 28px;
            font-weight: bold;
            color: #004B70;
            text-align: center;
        }

        .subtitle-app {
            text-align: center;
            font-size: 17px;
            margin-bottom: 25px;
            color: #004B70;
        }

        .form-row-custom {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .label-custom {
            width: 40%;
            font-weight: 600;
            color: #004B70;
        }

        .form-line {
            width: 60%;
            border: none;
            border-bottom: 2px solid #008060;
            background: transparent;
            outline: none;
            padding: 5px 0;
        }
    </style>
</head>

<body>

    <!-- Bande supérieure -->
    <div class="container-fluid top-bar">
        <div class="row align-items-center">
            <div class="col-1">
                <img src="logo-mairie-miniature-1707905764.png" >
                <!-- class="logo-small" -->
            </div>
            <div class="col-6"></div>

        </div>
    </div>

    <!-- Contenu principal -->
    <div class="container main-container">

        <div class="row">

            <!-- Carrousel à gauche -->
            <div class="col-md-5">
                <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="A.jpeg" class="d-block w-100">
                        </div>

                        <div class="carousel-item">
                            <img src="B.jpeg" class="d-block w-100">
                        </div>

                        <div class="carousel-item">
                            <img src="C.jpeg" class="d-block w-100">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulaire -->
            <div class="col-md-7">
                <div class="form-box">

                    <h2 class="title-app">SyGCoReC</h2>
                    <p class="subtitle-app">Système de Gestion de Collecte des Ressources Communales</p>

                    <form>

                        <div class="form-row-custom">
                            <label class="label-custom">Nom d'utilisateur</label>
                            <input type="text" class="form-line" placeholder="Nom d'utilisateur">
                        </div>

                        <div class="form-row-custom">
                            <label class="label-custom">Mot de passe</label>
                            <input type="password" class="form-line" placeholder="Mot de passe">
                        </div>

                        <div class="text-center">
                            <button class="btn btn-success px-5 py-2 rounded-pill">
                                Se connecter
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
